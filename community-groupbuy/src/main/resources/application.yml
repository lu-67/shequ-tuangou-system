spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 启动时自动执行建表与演示数据（演示用，每次启动重置）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
      continue-on-error: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.community.groupbuy.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j / OpenAPI3 文档
knife4j:
  enable: true
  setting:
    language: zh-CN
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  servlet:
    context-path: /
