spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境数据库地址/账号走环境变量，避免密钥入库
    url: ${DB_URL:jdbc:mysql://localhost:3306/community_groupbuy?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# 生产环境 JWT 密钥必须通过环境变量 JWT_SECRET 注入
jwt:
  secret: ${JWT_SECRET:please-change-this-secret}
  expiration: 86400000

app:
  redis:
    enabled: true
  rate-limit:
    enabled: true
    capacity: 200
    refill-tokens: 50
    refill-seconds: 1
